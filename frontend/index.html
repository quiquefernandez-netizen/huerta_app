<!doctype html>
<html lang="es" data-icon-style="holo">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#214e3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Panel de demostración para la gestión sencilla de una pequeña comunidad.">
    <title>Panel de la comunidad</title>
    <link rel="icon" type="image/png" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <script src="./js/theme-manager.js"></script>
    <link rel="stylesheet" href="./css/themes.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/iconography.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#inicio" aria-label="Ir a Inicio">
          <span class="brand__mark" aria-hidden="true"><img src="./assets/logo-dani-concept.png" alt=""></span>
        </a>
        <nav class="desktop-nav" data-navigation></nav>
        <div class="sidebar__note">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong>Panel de la comunidad</strong><small>Gestión compartida</small></div>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar__route">
            <a class="topbar__home" href="#inicio" aria-label="Ir a Inicio">
              <img class="topbar__logo" src="./assets/logo-dani-concept.png" alt="">
            </a>
            <div><h1 id="page-title">Inicio</h1><p id="page-context">Resumen de la comunidad</p></div>
          </div>
          <div class="topbar__tools">
            <div class="topbar-actions" id="topbar-actions"></div>
            <button class="install-app-button" id="install-app-button" type="button" hidden>Instalar</button>
            <button class="profile-button" type="button" data-open-appearance aria-label="Abrir perfil y apariencia">
              <span class="profile-avatar" aria-hidden="true"><span data-profile-initials>DR</span><svg class="profile-user-icon"><use href="#icon-user"></use></svg></span>
              <span class="profile-button__text"><strong>Demo Roble</strong><small>Administrador</small></span>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div class="loading-state" id="loading-state" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span>Cargando el panel…</span>
          </div>
          <div id="page-content" hidden></div>
        </main>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="Navegación móvil" data-mobile-navigation></nav>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
      <symbol id="icon-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-2.5A4.5 4.5 0 0 1 8 13h2a4.5 4.5 0 0 1 4.5 4.5V20M15.5 5.5a3 3 0 0 1 0 5.8M16 14h.5a4 4 0 0 1 4 4v2"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2.4c0-3.1 3.3-5.6 7.5-5.6s7.5 2.5 7.5 5.6V21"/></symbol>
      <symbol id="icon-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></symbol>
      <symbol id="icon-excel" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5V3Z"/><path d="M15 3v5h4M8 11l5 6M13 11l-5 6"/></symbol>
      <symbol id="icon-water" viewBox="0 0 24 24"><path d="M12 3S6 10 6 14a6 6 0 0 0 12 0c0-4-6-11-6-11Z"/><path d="M9 15a3 3 0 0 0 3 3"/></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="icon-bank" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5M4 20h16M6 9v8M10 9v8M14 9v8M18 9v8"/></symbol>
      <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-1 .8-1.3 1.8-1.3 3h-5.4C9.3 15.8 9 14.8 8 14Z"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3V6Z"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4.8l-.4 3.1a8 8 0 0 0-1.8 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2L3 14.5l2 3.4 2.4-1a8 8 0 0 0 1.8 1l.4 3.1h4.8l.4-3.1a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2.1-1.5a7 7 0 0 0 .1-1Z"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 7-8M15 7h5v5"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M20 4C11 4 5 8 5 15c0 3 2 5 5 5 7 0 10-8 10-16Z"/><path d="M4 21c2-5 6-9 12-12"/></symbol>
      <symbol id="icon-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></symbol>
      <symbol id="icon-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a1.8 1.8 0 0 0 1.1-3.2 1.8 1.8 0 0 1 1.1-3.2H18A3 3 0 0 0 21 11.5 9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="11" r=".8"/><circle cx="10" cy="7" r=".8"/><circle cx="15" cy="7.5" r=".8"/></symbol>
    </svg>
    <script src="./config.js"></script>
    <script>
      const installButton = document.querySelector("#install-app-button");
      let deferredInstallPrompt;

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installButton.hidden = false;
      });

      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = undefined;
        installButton.hidden = true;
      });

      window.addEventListener("appinstalled", () => { installButton.hidden = true; });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js", { scope: "./" }).catch((error) => console.warn("No se pudo preparar la aplicación para instalar.", error)));
      }
    </script>
    <script src="./js/vendor/xlsx.full.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
